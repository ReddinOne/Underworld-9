name: Validate source resources
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  resource-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: JSON/resource consistency checks
        run: python scripts/validate_resources.py
      - name: Wither skeleton guardian source checks
        run: python scripts/check_guardian.py
